<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>DANG KHOA – Khung thử V4</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--bg2:#dfe9f8;--card:#fff;--tx:#0e1a33;--mut:#5a6b8c;--line:#bfd0ee;--rgb:47,123,255;--hf:'Exo 2','Be Vietnam Pro',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1328;--bg2:#060910;--card:#0b1325;--tx:#e8eefc;--mut:#8da0c4;--line:#1f2d4a}}
:root[data-theme="dark"]{--bg:#0a1328;--bg2:#060910;--card:#0b1325;--tx:#e8eefc;--mut:#8da0c4;--line:#1f2d4a}
*,*::before,*::after{box-sizing:inherit}html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(900px 520px at 50% -6%,rgba(var(--rgb),.35),transparent 70%),linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--tx);font:15px/1.4 'Be Vietnam Pro',system-ui,sans-serif;overflow-wrap:anywhere;transition:background .5s}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:10px;padding:8px 2px 14px}
.logo{width:44px;height:44px;border-radius:12px;border:1px solid rgba(var(--rgb),.6);background:linear-gradient(145deg,rgba(var(--rgb),.4),var(--card));display:grid;place-items:center;font:800 20px var(--hf)}
.brand{font:800 19px var(--hf);letter-spacing:1.5px}.ver{margin-left:auto;font:700 11px var(--hf);letter-spacing:1px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;color:var(--mut);white-space:nowrap}
#bc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px;font-size:13px}
#bc button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px}#bc button.cur{border-color:rgba(var(--rgb),.9);box-shadow:0 0 12px rgba(var(--rgb),.45)}
#bc .bk{background:rgba(var(--rgb),.2);font-weight:600}#bc span{color:var(--mut)}
.ttl{font:800 26px var(--hf);letter-spacing:1px;margin:4px 0 2px}.hint{color:var(--mut);margin:0 0 16px}
#main{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 12px 16px;border-radius:26px;border:1px solid rgba(var(--rgb),.5);background:linear-gradient(160deg,rgba(var(--rgb),.2),var(--card));transition:.25s}
.card:hover,.card:focus-visible{border-color:rgba(var(--rgb),1);box-shadow:0 0 34px rgba(var(--rgb),.5);transform:translateY(-2px);outline:none}
.ic{width:92px;height:92px;border-radius:22px;overflow:hidden;display:grid;place-items:center;background:rgba(var(--rgb),.25);box-shadow:0 0 18px rgba(var(--rgb),.45)}
.ic img{width:100%;height:100%;object-fit:cover;display:block}.ic b{font:800 24px var(--hf);letter-spacing:1px}
.nm{font:800 17px var(--hf);letter-spacing:1px}.card small{color:var(--mut);font-size:12.5px}
.det{text-align:center;padding:22px 16px;border-radius:28px;border:1px solid rgba(var(--rgb),.5);background:linear-gradient(160deg,rgba(var(--rgb),.2),var(--card))}
.det .ic{width:132px;height:132px;margin:0 auto 12px;border-radius:30px}.det p{color:var(--mut);margin:6px 0}
.box{margin-top:16px;border:1px dashed rgba(var(--rgb),.7);border-radius:16px;padding:14px;color:var(--mut);font-size:14px}
.empty{text-align:center;color:var(--mut);padding:30px 10px;border:1px dashed var(--line);border-radius:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tabs{display:flex;gap:8px;margin:0 0 14px}.tabs button{flex:1;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:700 14px var(--hf);letter-spacing:.5px}.tabs button.on{border-color:rgba(var(--rgb),.95);background:rgba(var(--rgb),.22);box-shadow:0 0 14px rgba(var(--rgb),.5)}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 14px;color:var(--mut);font-size:13px}.tools i{display:inline-flex;align-items:center;gap:6px;font-style:normal;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 4px;background:var(--card);color:var(--tx)}.tools img{width:24px;height:24px;border-radius:7px}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:10px 14px 10px 10px;border-radius:20px;border:1px solid rgba(var(--rgb),.4);background:linear-gradient(150deg,rgba(var(--rgb),.16),var(--card));transition:.25s}
.row:hover,.row:focus-visible{border-color:rgba(var(--rgb),1);box-shadow:0 0 26px rgba(var(--rgb),.45);outline:none}
.th{flex:none;width:84px;height:84px;border-radius:16px;overflow:hidden;background:#05080f}.th img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}.th.g{width:124px}.th.g img{object-fit:contain;object-position:center}
.row .tx{flex:1;min-width:0}.row .nm{display:block}.row small{color:var(--mut)}.row .go{color:var(--mut);font-size:24px}
.det .pic{max-width:100%;max-height:460px;border-radius:20px;margin:0 auto 12px;display:block;background:#05080f}
.tabs button{font-size:13px}.th{display:grid;place-items:center}.th b{font:800 20px var(--hf)}
.dl{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:50px;margin-top:14px;border-radius:14px;border:1px solid rgba(var(--rgb),.9);background:linear-gradient(rgba(var(--rgb),.75),rgba(var(--rgb),.4));color:#fff;font:700 15px var(--hf);text-decoration:none}.dl[disabled]{opacity:.55;background:var(--card);color:var(--mut);border-color:var(--line)}
.th.a img{object-fit:contain;object-position:center;padding:3px}
.tabs{gap:6px}.tabs button{font-size:11.5px;letter-spacing:0;padding:0 2px}
</style></head><body>
